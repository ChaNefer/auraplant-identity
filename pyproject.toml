[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-core"
version = "0.1.0"
description = "Minimal identity library: email auth + Google/X OAuth (service-first)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "SQLAlchemy>=2.0",
  "Werkzeug>=3.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
flask = [
  "Flask>=3.0",
  "Flask-Login>=0.6",
  "Flask-Limiter>=3.5",
  "requests>=2.31",
]
dev = [
  "pytest>=8.0",
  "identity-core[flask]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
